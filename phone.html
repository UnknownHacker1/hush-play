<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a09">
<title>Hush</title>
<style>:root { --ink: #f3ecdf; --dim: #9a917e; --bg: #0b0a09; --line: #2c2620; --red: #e0311d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.4 Georgia, 'Times New Roman', serif; overscroll-behavior: none; }
#app { height: 100dvh; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); }
h1 { font-size: 3.4em; letter-spacing: 0.22em; margin: 0 0 0.1em; font-weight: 400; }
h1.small { font-size: 1.1em; margin: 0; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 1px solid #5a5142; padding: 12px 16px; border-radius: 3px; }
button:active { background: #221d17; }
button.big { width: 100%; padding: 18px; font-size: 1.15em; border-color: var(--ink); }
input { width: 100%; background: #14110e; border: 1px solid #3c352b; padding: 12px; border-radius: 3px; outline: none; }
input:focus { border-color: var(--ink); }

.door { margin: auto 0; text-align: center; }
.door p { color: var(--dim); }
.top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex: none; }
.top .who { color: var(--dim); font-size: 0.85em; }
.top .who.bad { color: var(--red); }
.note { color: var(--dim); font-size: 0.92em; flex: none; margin: 10px 0 0; }
.note b { color: var(--ink); font-weight: 400; }
.note button { display: block; margin-top: 10px; width: 100%; }
.caught { color: var(--red); margin: 10px 0 0; flex: none; }
#log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 0; min-height: 0; }
#log::before { content: ''; margin-top: auto; }
.m { max-width: 84%; }
.m small { display: block; color: var(--dim); font-size: 0.72em; letter-spacing: 0.08em; text-transform: uppercase; }
.m span { display: inline-block; border: 1px solid #3c352b; padding: 7px 11px; overflow-wrap: anywhere; }
.m.mine { align-self: flex-end; text-align: right; }
.m.mine span { background: #1b1712; }
.m.it span { border-color: #6a2418; }
.m.sys { align-self: center; color: var(--dim); font-size: 0.85em; text-align: center; max-width: 100%; }
.send { flex: none; border-top: 1px solid var(--line); padding-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip { display: flex; }
.chip button { padding: 7px 11px; font-size: 0.92em; }
.chip button.on { border-color: var(--ink); background: #221d17; }
.chip button.rg { border-left: 0; color: var(--red); }
.chip button:disabled { color: #5a5142; }
.typing { display: flex; gap: 8px; }
.typing button { flex: none; }

.over { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: var(--bg); z-index: 5; }
.over .big-line { font-size: 1.7em; }
.over .dim { color: var(--dim); }
.ringing { animation: ring 1s steps(2) infinite; }
.ringing .big-line { letter-spacing: 0.04em; }
.ringing button { border-color: var(--ink); font-size: 1.5em; padding: 30px; background: #000; }
@keyframes ring { 0% { background: #0b0a09; } 50% { background: #2c0c07; } }
.task .got { font-size: 1.25em; margin-bottom: 22px; overflow-wrap: anywhere; }
.task .got small { display: block; color: var(--dim); font-size: 0.6em; letter-spacing: 0.08em; text-transform: uppercase; }
.task .line { font-size: 1.6em; border: 1px solid var(--ink); padding: 14px 10px; user-select: none; }
.task input { text-align: center; font-size: 1.2em; }
.task.no input { border-color: var(--red); }
</style>
</head>
